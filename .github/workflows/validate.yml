name: Repository validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements_coupling.txt

      - name: Install analysis dependencies
        run: python -m pip install -r requirements_analysis.txt

      - name: Validate repository
        run: python tools/validate_repository.py
